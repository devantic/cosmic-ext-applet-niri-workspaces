[package]
name = "cosmic-ext-applet-niri-workspaces"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A COSMIC panel applet that shows and switches niri workspaces"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["applet", "applet-token", "tokio", "wayland", "winit"]

[profile.release]
strip = true
